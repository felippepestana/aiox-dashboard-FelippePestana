# ============================================================
# AIOX Legal Dashboard - Docker Compose
# Services: Next.js web app + Bun monitor server
# ============================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must exist at build time (inlined into the browser
      # bundle); compose interpolates these from the .env file in this dir.
      args:
        # Required (:?) — an empty value would be permanently inlined into the
        # browser bundle and ship a client that cannot reach Supabase
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required for the build}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required for the build}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY is required for the build}
        NEXT_PUBLIC_MP_PUBLIC_KEY: ${NEXT_PUBLIC_MP_PUBLIC_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: aiox-web
    restart: unless-stopped
    ports:
      # Localhost only — exposing 0.0.0.0 would let clients skip Nginx and
      # spoof X-Forwarded-For, bypassing the login/signup rate limits
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LEGAL_DB_PATH=/data/legal.db
    volumes:
      - app-data:/data
      - app-uploads:/app/uploads
    depends_on:
      monitor:
        condition: service_healthy
    networks:
      - aiox-network

  monitor:
    image: oven/bun:1-alpine
    container_name: aiox-monitor
    restart: unless-stopped
    working_dir: /app/server
    command: bun run server.ts
    ports:
      - "127.0.0.1:4001:4001"
    env_file:
      - .env
    environment:
      - MONITOR_PORT=4001
      - MONITOR_DB_PATH=/data/events.db
    volumes:
      - ./server:/app/server:ro
      - app-data:/data
      - app-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - aiox-network

volumes:
  app-data:
    driver: local
  app-uploads:
    driver: local

networks:
  aiox-network:
    driver: bridge
