# ============================================================
# Continuous deploy to the Hostinger VPS (replaces Vercel).
#
# Required repository secrets (Settings → Secrets → Actions):
#   VPS_HOST     — VPS IP or hostname
#   VPS_USER     — SSH user (e.g. root)
#   VPS_SSH_KEY  — private key with access to the VPS
# Optional:
#   VPS_APP_DIR  — app directory on the VPS (default /opt/aiox-legal)
#   VPS_DOMAIN   — public domain; when set, the daily-alerts crontab entry is
#                  (re)provisioned on each deploy (same logic as deploy.sh)
#   VPS_SSH_FINGERPRINT — SHA256 host-key fingerprint to pin the VPS identity
#                  (recommended; empty skips verification)
#
# If the secrets are not configured the job skips gracefully.
# ============================================================
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS secrets (VPS_HOST, VPS_USER, VPS_SSH_KEY) not fully configured — skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Pins the VPS host key (get it with:
          # ssh-keygen -l -f /etc/ssh/ssh_host_ed25519_key.pub | cut -d' ' -f2)
          # — without it a spoofed SSH server could receive the deploy.
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script_stop: true
          script: |
            cd ${{ secrets.VPS_APP_DIR || '/opt/aiox-legal' }}
            git fetch origin main
            git reset --hard origin/main
            docker compose build web
            docker compose up -d
            # The monitor runs bind-mounted source (no image rebuild), so
            # `up -d` never recreates it — force it to pick up server/ changes.
            docker compose up -d --force-recreate monitor
            docker compose ps
            # Keep the daily-alerts crontab in sync (mirrors scripts/deploy.sh);
            # runs only when VPS_DOMAIN is configured and CRON_SECRET is real.
            DOMAIN="${{ secrets.VPS_DOMAIN }}"
            CRON_SECRET_VALUE=$(grep -E '^CRON_SECRET=' .env 2>/dev/null | cut -d= -f2-)
            if [ -n "$DOMAIN" ] && [ -n "$CRON_SECRET_VALUE" ] && [ "$CRON_SECRET_VALUE" != "generate-a-random-32-char-string" ]; then
              CRON_LINE="0 8 * * * curl -fsS -H \"Authorization: Bearer $CRON_SECRET_VALUE\" https://$DOMAIN/api/cron/daily-alerts > /dev/null 2>&1"
              if ! crontab -l 2>/dev/null | grep -qF "$CRON_LINE"; then
                (crontab -l 2>/dev/null | grep -v "api/cron/daily-alerts"; echo "$CRON_LINE") | crontab -
                echo "Daily-alerts crontab refreshed."
              fi
            fi
